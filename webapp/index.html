<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tegen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-decor"></div>
    <h1>🛒 Tegen</h1>
  </header>

  <div id="promo" class="promo hidden">
    <div class="promo-track" id="promo-track"></div>
    <div class="promo-dots" id="promo-dots"></div>
  </div>

  <div class="order-search">
    <div class="search-row">
      <button id="search-btn" class="search-icon" aria-label="Qidirish">🔍</button>
      <input type="text" id="search-input" placeholder="Mahsulot nomini yozing">
    </div>
    <div id="search-result" class="search-result hidden"></div>
  </div>

  <div id="categories" class="categories"></div>

  <main id="products" class="products"></main>

  <div id="cart-list" class="cart-list hidden"></div>

  <div id="cart-bar" class="cart-bar hidden">
    <span id="cart-summary"></span>
    <button id="checkout-btn">Buyurtma berish →</button>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Oziq-ovqat do'koni</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="header">
    <h1>🛒 Oziq-ovqat do'koni</h1>
  </header>

  <div class="order-search">
    <h2>🔎 Buyurtmani qidirish</h2>
    <div class="search-row">
      <input type="number" id="search-input" placeholder="Navbat raqami (masalan: 5)">
      <button id="search-btn">Qidirish</button>
    </div>
    <div id="search-result" class="search-result hidden"></div>
  </div>

  <div id="categories" class="categories"></div>

  <main id="products" class="products"></main>

  <div id="cart-list" class="cart-list hidden"></div>

  <div id="cart-bar" class="cart-bar hidden">
    <span id="cart-summary"></span>
    <button id="checkout-btn">Buyurtma berish</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
